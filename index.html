<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenCat</title>
<meta name="description" content="고양이가 Claude 토큰 사용량을 알려줘요 — 메뉴바 픽셀 고양이 앱">
<meta property="og:title" content="TokenCat">
<meta property="og:description" content="고양이가 Claude 토큰 사용량을 알려줘요 — 메뉴바 픽셀 고양이 앱">
<meta property="og:image" content="https://pangyosim.github.io/token-cat/icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* 아이콘과 같은 라벤더 배경에 검은 고양이 — 브랜드가 밝은 배경 전제라 단일 테마로 간다 */
  :root {
    --bg: #e9e7f3;
    --panel: #ffffff;
    --ink: #17171c;
    --muted: #6b6a76;
    --line: #17171c;
    --green: #60c860;
    --green-deep: #2f8f43;
    --amber: #e8be48;
    --red: #e86054;
    --lav-top: #e8e6f2;
    --lav-bottom: #c4c1d6;
    --pixel: "Press Start 2P", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    word-break: keep-all; /* 한국어를 어절 단위로 줄바꿈 — 음절 중간에서 꺾이면 잘린 것처럼 보인다 */
  }
  .wrap { max-width: 60rem; margin: 0 auto; padding: 0 1.25rem; }
  canvas { image-rendering: pixelated; display: block; }
  a { color: inherit; }

  /* ── 헤더 ── */
  header {
    border-bottom: 2px solid var(--line);
    background: color-mix(in srgb, var(--bg) 82%, white);
  }
  header .wrap { display: flex; align-items: center; gap: .75rem; height: 4rem; }
  .logo { width: 2rem; height: 2rem; border-radius: .45rem; }
  .wordmark { font-family: var(--pixel); font-size: .85rem; letter-spacing: -.02em; }
  header nav { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
  .lang { display: flex; border: 2px solid var(--line); border-radius: .5rem; overflow: hidden; }
  .lang button {
    font: inherit; font-size: .78rem; font-weight: 700; padding: .3rem .6rem;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .gh { display: inline-flex; align-items: center; text-decoration: none; }
  .gh svg { width: 1.4rem; height: 1.4rem; }

  /* ── 히어로 ── */
  .hero { padding: 4rem 0 3.5rem; }
  /* 모바일에서 목업이 다운로드보다 먼저 오도록 3블록을 grid-area로 배치한다 */
  .hero .wrap {
    display: grid; grid-template-columns: 1.05fr .95fr; column-gap: 3rem;
    grid-template-areas: "intro mock" "dl mock";
  }
  .intro { grid-area: intro; }
  .dl-block { grid-area: dl; }
  .mock-block { grid-area: mock; align-self: center; }
  .eyebrow { font-family: var(--pixel); font-size: .6rem; color: var(--green-deep); margin: 0 0 1rem; }
  h1 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); line-height: 1.32; margin: 0 0 1.8rem; letter-spacing: -.01em; }
  .h1-br { display: none; } /* 폰에서만 지정한 자리에서 줄을 바꾼다 */

  /* 다운로드 */
  .dl-status { font-family: var(--pixel); font-size: .6rem; color: var(--muted); margin-bottom: .75rem; }
  .dl-status a { color: var(--green-deep); }
  .dl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; max-width: 30rem; }
  a.dl {
    display: block; padding: .7rem .9rem; text-decoration: none;
    background: var(--panel); border: 2px solid var(--line); border-radius: .6rem;
    box-shadow: 3px 3px 0 var(--line); transition: transform .08s, box-shadow .08s;
  }
  a.dl:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--line); }
  a.dl:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--line); }
  a.dl .os { display: block; font-weight: 700; font-size: .92rem; }
  a.dl .meta { display: block; font-size: .74rem; color: var(--muted); margin-top: .15rem; }
  .dl-note { font-size: .78rem; color: var(--muted); margin-top: .9rem; }
  .dl-note a { color: var(--green-deep); }

  /* 메뉴바 목업 */
  .mock {
    border: 2px solid var(--line); border-radius: .9rem; overflow: hidden;
    box-shadow: 6px 6px 0 var(--line);
    background: linear-gradient(160deg, var(--lav-top), var(--lav-bottom));
  }
  .menubar {
    display: flex; align-items: center; gap: .9rem; padding: .4rem .8rem;
    background: rgba(255, 255, 255, .66); backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(23, 23, 28, .12);
  }
  .menubar .stub { display: flex; gap: .6rem; }
  .menubar .stub i { display: block; width: 1.6rem; height: .45rem; border-radius: .25rem; background: rgba(23, 23, 28, .18); }
  .menubar .tray { margin-left: auto; display: flex; align-items: center; gap: .7rem; }
  .menubar .clock { font-size: .72rem; font-weight: 600; color: rgba(23, 23, 28, .75); font-variant-numeric: tabular-nums; }
  .mock .desk { height: 11rem; position: relative; }
  .mock .hint {
    position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%);
    font-family: var(--pixel); font-size: .55rem; color: rgba(23, 23, 28, .45); white-space: nowrap;
  }
  /* 좁은 화면에서는 글자·색상 견본이 같이 줄어들어 항상 한 줄에 들어간다 */
  .mock-caption { font-size: min(.78rem, 2.8vw); white-space: nowrap; color: var(--muted); margin-top: .8rem; text-align: center; }
  .swatch { display: inline-block; width: .75em; height: .75em; border: 1px solid var(--line); border-radius: .15rem; vertical-align: -.05em; }

  /* ── 상태 카드 ── */
  .states { padding: 3.5rem 0 4rem; border-top: 2px solid var(--line); background: color-mix(in srgb, var(--bg) 55%, white); }
  h2 { font-size: 1.5rem; margin: 0 0 .4rem; }
  .sec-sub { color: var(--muted); margin: 0 0 2rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: .8rem; overflow: hidden; box-shadow: 4px 4px 0 var(--line); }
  .card .stage { background: linear-gradient(160deg, var(--lav-top), var(--lav-bottom)); padding: 1.1rem 0; display: flex; justify-content: center; border-bottom: 2px solid var(--line); }
  .card .body { padding: .8rem .95rem 1rem; }
  .card .badge { font-family: var(--pixel); font-size: .5rem; color: var(--green-deep); }
  .card h3 { margin: .3rem 0 .15rem; font-size: 1rem; }
  .card p { margin: 0; font-size: .8rem; color: var(--muted); }

  /* ── 설치 안내 ── */
  .help { padding: 3.5rem 0 4rem; border-top: 2px solid var(--line); }
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .help-card { background: var(--panel); border: 2px solid var(--line); border-radius: .8rem; padding: 1.1rem 1.2rem; box-shadow: 4px 4px 0 var(--line); }
  .help-card h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .help-card p { margin: 0; font-size: .85rem; color: var(--muted); }
  .help-card code, .help-card pre {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem;
  }
  .help-card pre {
    background: var(--ink); color: var(--green); padding: .6rem .8rem; border-radius: .5rem;
    margin: .7rem 0 0; overflow-x: auto;
  }

  footer { border-top: 2px solid var(--line); padding: 1.4rem 0 2rem; font-size: .8rem; color: var(--muted); }
  footer a { color: var(--green-deep); }

  @media (max-width: 800px) {
    .hero { padding: 2.5rem 0; }
    .hero .wrap { grid-template-columns: 1fr; grid-template-areas: "intro" "mock" "dl"; row-gap: 2rem; }
    h1 { margin-bottom: 0; }
    .help-grid { grid-template-columns: 1fr; }
    .mock .desk { height: 8rem; }
  }
  @media (max-width: 480px) {
    .dl-grid { grid-template-columns: 1fr; }
    .h1-br { display: inline; }
  }
</style>
</head>

  <div class="wrap">
    <img class="logo" src="icon.png" alt="TokenCat 로고">
    <span class="wordmark">TokenCat</span>
    <nav>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-ko" aria-pressed="true">KR</button>
        <button id="lang-en" aria-pressed="false">EN</button>
      </div>
      <a class="gh" href="https://github.com/pangyosim/token-cat" aria-label="GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="intro">
      <p class="eyebrow">CLAUDE TOKEN MONITOR</p>
      <h1 data-i18n-html="h1"></h1>
    </div>
    <div class="dl-block">
      <p class="dl-status" id="dl-status"></p>
      <div class="dl-grid" id="dl-grid"></div>
      <p class="dl-note" data-i18n-html="dlNote"></p>
    </div>
    <div class="mock-block">
      <div class="mock" aria-hidden="true">
        <div class="menubar">
          <div class="stub"><i></i><i></i><i></i></div>
          <div class="tray">
            <canvas id="tray-cat" width="45" height="14" style="height:28px"></canvas>
            <span class="clock">9:41</span>
          </div>
        </div>
        <div class="desk"><span class="hint">^ TokenCat</span></div>
      </div>
      <p class="mock-caption">
        <span class="swatch" style="background:var(--green)"></span>
        <span class="swatch" style="background:var(--amber)"></span>
        <span class="swatch" style="background:var(--red)"></span>
        <span data-i18n="mockCaption"></span>
      </p>
    </div>
  </div>
</section>

<section class="states">
  <div class="wrap">
    <p class="eyebrow" data-i18n="statesEyebrow"></p>
    <h2 data-i18n="statesH2"></h2>
    <p class="sec-sub" data-i18n="statesSub"></p>
    <div class="cards">
      <div class="card">
        <div class="stage"><canvas data-motion="run" width="20" height="14" style="height:70px" aria-hidden="true"></canvas></div>
        <div class="body"><span class="badge">NOW</span><h3 data-i18n="runT"></h3><p data-i18n="runD"></p></div>
      </div>
      <div class="card">
        <div class="stage"><canvas data-motion="ball" width="20" height="14" style="height:70px" aria-hidden="true"></canvas></div>
        <div class="body"><span class="badge">&lt; 10 MIN</span><h3 data-i18n="ballT"></h3><p data-i18n="ballD"></p></div>
      </div>
      <div class="card">
        <div class="stage"><canvas data-motion="rhythm" width="20" height="14" style="height:70px" aria-hidden="true"></canvas></div>
        <div class="body"><span class="badge">&lt; 1 HOUR</span><h3 data-i18n="rhythmT"></h3><p data-i18n="rhythmD"></p></div>
      </div>
      <div class="card">
        <div class="stage"><canvas data-motion="sleep" width="20" height="14" style="height:70px" aria-hidden="true"></canvas></div>
        <div class="body"><span class="badge">1 HOUR +</span><h3 data-i18n="sleepT"></h3><p data-i18n="sleepD"></p></div>
      </div>
    </div>
  </div>
</section>

<section class="help" id="install">
  <div class="wrap">
    <p class="eyebrow">INSTALL</p>
    <h2 data-i18n="helpH2"></h2>
    <p class="sec-sub" data-i18n="helpSub"></p>
    <div class="help-grid">
      <div class="help-card">
        <h3>macOS</h3>
        <p data-i18n="helpMac"></p>
        <pre>xattr -cr /Applications/TokenCat.app</pre>
      </div>
      <div class="help-card">
        <h3>Windows</h3>
        <p data-i18n="helpWin"></p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">

  </div>
</footer>

// 검정 팔레트 (src/cat.ts PALETTES.black)
const INK = { o: "#0c0c0c", b: "#303030", w: "#303030", a: "#303030", g: "#303030", e: "#60c860", z: "#0c0c0c" };
const BALL = "#e8c43d";
const GAUGE = { frame: "rgba(150,150,158,.82)", plenty: "#60c86c", half: "#e8be48", low: "#e86054" };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

function drawFrame(ctx, f) {
  f.s.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const c = INK[row[x]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x, y + f.dy, 1, 1);
    }
  });
  if (f.ball) { ctx.fillStyle = BALL; ctx.fillRect(f.ball[0], f.ball[1], 2, 2); }
}

// 트레이 아이콘과 같은 구성: 고양이 20칸 + 여백 5칸 + 게이지 20×5
function drawGauge(ctx, ratio) {
  const gx = 25, top = 4, h = 5, w = 20;
  ctx.fillStyle = GAUGE.frame;
  ctx.fillRect(gx, top, w, 1); ctx.fillRect(gx, top + h - 1, w, 1);
  ctx.fillRect(gx, top, 1, h); ctx.fillRect(gx + w - 1, top, 1, h);
  const inner = w - 2;
  const filled = ratio <= 0 ? 0 : Math.max(1, Math.round(inner * ratio));
  ctx.fillStyle = ratio < 0.5 ? GAUGE.plenty : ratio < 0.8 ? GAUGE.half : GAUGE.low;
  ctx.fillRect(gx + 1, top + 1, filled, h - 2);
}

function animate(canvas, motion, withGauge) {
  const ctx = canvas.getContext("2d");
  const frames = DATA.motions[motion];
  let i = 0, ratio = 0;
  const tick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFrame(ctx, frames[i]);
    if (withGauge) {
      drawGauge(ctx, ratio);
      ratio += 1 / 240; // 10fps × 24초에 한 바퀴 — 색 변화가 보일 만큼 느리게
      if (ratio > 1.04) ratio = 0;
    }
    i = (i + 1) % frames.length;
  };
  tick();
  if (!REDUCED) setInterval(tick, 1000 / DATA.fps[motion]);
}

animate(document.getElementById("tray-cat"), "run", true);
document.querySelectorAll("canvas[data-motion]").forEach((c) => animate(c, c.dataset.motion, false));

let lang = localStorage.getItem("tokencat-lang")
  || (navigator.language.startsWith("ko") ? "ko" : "en");

function applyLang() {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.getElementById("lang-ko").setAttribute("aria-pressed", String(lang === "ko"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  renderDownloads();
}
for (const l of ["ko", "en"]) {
  document.getElementById(`lang-${l}`).addEventListener("click", () => {
    lang = l;
    localStorage.setItem("tokencat-lang", l);
    applyLang();
  });
}

// ── 다운로드: 최신 릴리스에서 자산 목록을 읽는다 — 새 버전을 올려도 페이지 수정이 없다 ──
const REPO = "pangyosim/token-cat";
let release = null;

function assetKind(name) {
  if (name.endsWith(".dmg")) return name.includes("arm64") ? "macArm" : "macX64";
  if (name.includes("win") && name.endsWith(".zip")) return name.includes("arm64") ? "winArm" : "winX64";
  return null; // blockmap 등은 숨긴다
}

function renderDownloads() {
  const t = I18N[lang];
  const status = document.getElementById("dl-status");
  const grid = document.getElementById("dl-grid");
  if (release === null) { status.textContent = t.dlLoading; return; }
  if (release === "error") { status.innerHTML = t.dlFail; return; }

  grid.innerHTML = "";
  const order = ["macArm", "macX64", "winX64", "winArm"];
  const byKind = {};
  for (const a of release.assets) {
    const kind = assetKind(a.name);
    if (kind) byKind[kind] = a;
  }
  for (const kind of order) {
    const a = byKind[kind];
    if (!a) continue;
    const el = document.createElement("a");
    el.className = "dl";
    el.href = a.browser_download_url;
    el.innerHTML = '<span class="os"></span><span class="meta"></span>';
    el.querySelector(".os").textContent = t[kind];
    el.querySelector(".meta").textContent = `${t[kind + "Meta"]} · ${(a.size / 1048576).toFixed(0)} MB`;
    grid.appendChild(el);
  }
  status.textContent = `${release.tag_name} · ${new Date(release.published_at).toLocaleDateString(lang === "ko" ? "ko-KR" : "en-US")}`;
}

applyLang();
fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((rel) => { release = rel; renderDownloads(); })
  .catch(() => { release = "error"; renderDownloads(); });
